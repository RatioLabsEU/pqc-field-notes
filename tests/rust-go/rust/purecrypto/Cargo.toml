[package]
name = "wycheproof-purecrypto"
version = "0.1.0"
edition = "2024"
publish = false

# Latest version published on crates.io. Only the ML-KEM and ML-DSA parts (the crate also has TLS, X.509…).
[dependencies]
purecrypto = { version = "=0.10.6", default-features = false, features = ["std", "mlkem", "mldsa"] }
