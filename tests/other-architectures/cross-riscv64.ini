# Meson cross file: leancrypto for riscv64 (Linux, glibc, rv64gc). Used by run.sh ("meson setup --cross-file
# cross-riscv64.ini"). Compiler: package gcc-riscv64-linux-gnu.
# With cpu_family = 'riscv64', leancrypto's meson.build enables riscv64_asm (-DLC_HOST_RISCV64): rv64im assembly and RVV
# (VLEN 128 and 256), chosen at run time.
#
# Copyright 2026 RatioLabs (https://www.ratiolabs.eu). Licensed under the Apache License, Version 2.0.
[binaries]
c = 'riscv64-linux-gnu-gcc'
ar = 'riscv64-linux-gnu-ar'
strip = 'riscv64-linux-gnu-strip'
exe_wrapper = ['qemu-riscv64', '-cpu', 'max', '-L', '/usr/riscv64-linux-gnu']

[host_machine]
system = 'linux'
cpu_family = 'riscv64'
cpu = 'riscv64'
endian = 'little'
