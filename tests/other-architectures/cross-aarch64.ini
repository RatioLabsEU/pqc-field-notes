# Meson cross file: leancrypto for aarch64 (Linux, glibc). Used by run.sh ("meson setup --cross-file cross-aarch64.ini").
# Compiler: package gcc-aarch64-linux-gnu.
# exe_wrapper is only there in case meson needs to run something while configuring; the tests are run separately with qemu.
#
# Copyright 2026 RatioLabs (https://www.ratiolabs.eu). Licensed under the Apache License, Version 2.0.
[binaries]
c = 'aarch64-linux-gnu-gcc'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
exe_wrapper = ['qemu-aarch64', '-cpu', 'max', '-L', '/usr/aarch64-linux-gnu']

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
